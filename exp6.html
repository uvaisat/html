<html>
<head>
<title>JavaScript Predefined Functions</title>
<style>
    body{
        margin: 20px;
        background-color: rgb(231, 238, 201);
        font-size: 20px;
    }
    h2{
        color: rgb(168, 16, 110);
    }
</style>
</head>
<body>
<h1 style="color: blue;"><center>JavaScript Predefined Functions</center></h1>
<h2>1. String Object Functions</h2>
<script>
let a = prompt("Enter the first string:");
let b = prompt("Enter the second string:");
document.write(`First string : ${a}<br>`);
document.write(`Second string : ${b}<br>`);
document.write(`Concatenation of both strings: ${a.concat(" ",b)}<br>`);
document.write(`length of first string : ${a.length}<br>`);
document.write(`length of second string : ${b.length}<br>`);
document.write(`Uppercase of first string : ${a.toUpperCase()}<br>`);
document.write(`Uppercase of second string : ${b.toUpperCase()}<br>`);
document.write(`Lowercase of first string : ${a.toLowerCase()}<br>`);
document.write(`Lowercase of second string : ${b.toLowerCase()}<br>`);
document.write(`Character of Position (3) in ${a} : ${a.charAt(3)}<br>`);
document.write(`Slicing (1,4) of first string: ${a.slice(1,4)}<br>`);
let oldWord = prompt("Enter the word to replace:");
let newWord = prompt("Enter the new word:");
document.write(`Replace the word "${oldWord}" in first string: ${a.replace(oldWord,newWord)}<br>`);
</script>
<hr>
<h2>2.Math Object Functions</h2>
<script>
let x = parseFloat(prompt("Enter a number:"));
document.write(`Number : ${x}<br>`);
document.write(`Square Root : ${Math.sqrt(x)}<br>`);
document.write(`Square Value : ${Math.pow(x,2)}<br>`);
document.write(`Absolute Value : ${Math.abs(x)}<br>`);
document.write(`Round Value : ${Math.round(x)}<br>`);
document.write(`Ceil Value : ${Math.ceil(x)}<br>`);
document.write(`Floor Value : ${Math.floor(x)}<br>`);
document.write(`Value of Pi: ${Math.PI}<br>`);
document.write(`Random Value : ${Math.random()}<br>`);
document.write(`Max Value in (56,31,89,67): ${Math.max(56,31,89,67)}<br>`);
document.write(`Min Value in (21,4,115,91): ${Math.min(21,4,115,91)}<br>`);
</script>
</body>
</html>
