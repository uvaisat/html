<!DOCTYPE html>
<html>
<head>
    <title>Registration Form</title>
    <style>
        body {
            font-family: Arial;
            background-color: rgb(147, 182, 184);
        }h2 {
            color: blue;
        }form {
            width: 300px;
            margin: auto;
            background-color: rgb(132, 237, 247);
            padding: 20px;
            border: 1px solid rgb(161, 102, 102);
            border-radius: 12px;
        }input {
            padding: 8px;
            margin: 5px 0 10px;
        }input[type="text"], input[type="password"] {
            width: 95%;
            box-sizing: border-box;
            border-radius: 6px;
        }button {
            padding: 8px 15px;
        }.error {
            color: rgb(255, 0, 0);
            font-size: 12px;
            display: block;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>
<form onsubmit="return validateForm()">
    <h2 align="center">Registration Form</h2>
    <b>Name:</b>
    <input type="text" id="name">
    <b>Email:</b>
    <input type="text" id="email" oninput="validateEmail()">
    <span id="emailError" class="error"></span>
    <b>Password:</b>
    <input type="password" id="password" oninput="validatePassword()">
    <span id="passwordError" class="error"></span>
    <b>Confirm Password:</b>
    <input type="password" id="confirm" oninput="validateConfirm()">
    <span id="confirmError" class="error"></span>
    <b>Phone Number:</b>
    <input type="text" id="phone" oninput="validatePhone()">
    <span id="phoneError" class="error"></span>
    <b>Gender:</b><br>
    <input type="radio" name="gender" value="Male"> Male
    <input type="radio" name="gender" value="Female"> Female
    <input type="radio" name="gender" value="Other"> Other
    <br><br>
    <button type="submit">Register</button>
    <button type="reset">Clear</button>
</form>
<script>
function validateEmail() {
    let email = document.getElementById("email").value;
    let error = document.getElementById("emailError");
    if (email == "") {
        error.innerHTML = "Email is required";
    }
    else if (!email.includes("@") || !email.includes(".")) {
        error.innerHTML = "Please enter a valid email";
    }
    else {
        error.innerHTML = "";
    }
}
function validatePassword() {
    let password = document.getElementById("password").value;
    let error = document.getElementById("passwordError");
    if (password == "") {
        error.innerHTML = "Password is required";
    }
    else if (password.length < 6) {
        error.innerHTML = "Password must contain at least 6 characters";
    }
    else {
        error.innerHTML = "";
    }
    validateConfirm();
}
function validateConfirm() {
    let password = document.getElementById("password").value;
    let confirm = document.getElementById("confirm").value;
    let error = document.getElementById("confirmError");
    if (confirm == "") {
        error.innerHTML = "Please confirm your password";
    }
    else if (password != confirm) {
        error.innerHTML = "Passwords do not match";
    }
    else {
        error.innerHTML = "";
    }
}
function validatePhone() {
    let phone = document.getElementById("phone").value;
    let error = document.getElementById("phoneError");
    if (phone == "") {
        error.innerHTML = "Phone number is required";
    }
    else if (!/^[0-9]{10}$/.test(phone)) {
        error.innerHTML = "Enter a valid 10-digit phone number";
    }
    else {
        error.innerHTML = "";
    }
}
function validateForm() {
    let name = document.getElementById("name").value;
    let gender = document.querySelector(
        'input[name="gender"]:checked'
    );
    validateEmail();
    validatePassword();
    validateConfirm();
    validatePhone();
    if (name == "") {
        alert("Please enter your name");
        return false;
    }
    if (document.getElementById("emailError").innerHTML != "" ||
        document.getElementById("passwordError").innerHTML != "" ||
        document.getElementById("confirmError").innerHTML != "" ||
        document.getElementById("phoneError").innerHTML != "") {
        return false;
    }
    if (!gender) {
        alert("Please select your gender");
        return false;
    }
    alert("Registration Successful!");
    return true;
}
</script>
</body>
</html>
