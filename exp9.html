<html>
    <head>
        <title>Bgcolor Change</title>
        <style>
            body{
                margin: 15px;
            }h1{
                color: blue;
            }button {
                background-color: blue;
                color: white;
                padding: 12px 25px;
                border-radius: 8px;
                font-size: 16px;
                font-weight: bold;
            }
        </style>
    </head>
<body>
<center>
    <h1><b>Change background Color</b></h1>
<button type="button" onclick="colorchange();">Change background color</button>
</center>
<script>
var color=["lightblue","lightgreen","magenta","skyblue","black","lightpink","lightyellow","pink","aqua"];
var l=color.length;
var i=0;
function colorchange(){
document.getElementsByTagName("body")[0].style.backgroundColor=color[i];
i=(i+1)%l;
}
</script>
</body>
</html>
